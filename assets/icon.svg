<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Original plugin icon: a friendly robot/chatbot face on the plugin's
       primary blue, with identicon-style corner tiles as a nod to
       Gravatar's generated avatars. Drawn for this plugin — not Gravatar
       artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0050d8"/>
      <stop offset="1" stop-color="#0041b0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- Identicon-style corner tiles. -->
  <g fill="#ffffff" opacity="0.18">
    <rect x="26" y="26" width="26" height="26" rx="7"/>
    <rect x="204" y="26" width="26" height="26" rx="7"/>
    <rect x="26" y="204" width="26" height="26" rx="7"/>
    <rect x="204" y="204" width="26" height="26" rx="7"/>
  </g>
  <!-- Robot head. -->
  <g>
    <line x1="128" y1="54" x2="128" y2="78" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="128" cy="46" r="13" fill="#ffffff"/>
    <rect x="68" y="78" width="120" height="98" rx="26" fill="#ffffff"/>
    <rect x="50" y="108" width="18" height="38" rx="9" fill="#ffffff"/>
    <rect x="188" y="108" width="18" height="38" rx="9" fill="#ffffff"/>
    <circle cx="105" cy="119" r="12" fill="#0050d8"/>
    <circle cx="151" cy="119" r="12" fill="#0050d8"/>
    <rect x="100" y="146" width="56" height="11" rx="5.5" fill="#0050d8"/>
  </g>
</svg>
